<title>기분/상황 책 추천</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2b2620; --muted:#8a8074;
    --accent:#b9542c; --accent-soft:#f4e3d6; --line:#e8e0d4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); padding:32px 20px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:24px; margin:0 0 6px;}
  .sub{color:var(--muted); margin:0 0 28px; font-size:14px;}
  .section{margin-bottom:24px;}
  .section h2{font-size:14px; color:var(--muted); margin:0 0 10px; font-weight:600;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:7px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13px; cursor:pointer; user-select:none;
    transition:all .15s;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .actions{display:flex; gap:10px; margin:28px 0;}
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:12px 22px;
    border-radius:10px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button.primary:hover{background:#9c4422;}
  button.ghost{
    background:transparent; color:var(--muted); border:1px solid var(--line);
    padding:12px 18px; border-radius:10px; font-size:14px; cursor:pointer;
  }
  #results{display:flex; flex-direction:column; gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; display:flex; gap:16px; align-items:flex-start;
  }
  .rank{
    width:30px; height:30px; border-radius:50%; background:var(--accent-soft);
    color:var(--accent); font-weight:700; font-size:14px; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
  }
  .card .title{font-size:16px; font-weight:700; margin:0 0 2px;}
  .card .meta{font-size:12px; color:var(--muted); margin:0 0 8px;}
  .card .why{font-size:13.5px; line-height:1.55; margin:0;}
  .tag-row{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap;}
  .tag{font-size:11px; background:var(--accent-soft); color:var(--accent); padding:2px 8px; border-radius:6px;}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:30px 0;}
  .badge-src{
    display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--line);
    border-radius:6px; padding:3px 8px; margin-bottom:18px;
  }
</style>
</head>

<div class="wrap">

  </div>

</div>

const moodSet = new Set();
const situSet = new Set();
BOOKS.forEach(b => {
  (b.mood_tags||[]).forEach(t => moodSet.add(t));
  (b.situation_tags||[]).forEach(t => situSet.add(t));
});

const selectedMoods = new Set();
const selectedSitus = new Set();

function renderChips(containerId, items, selectedSet) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  items.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = tag;
    chip.addEventListener('click', () => {
      if (selectedSet.has(tag)) { selectedSet.delete(tag); chip.classList.remove('active'); }
      else { selectedSet.add(tag); chip.classList.add('active'); }
    });
    el.appendChild(chip);
  });
}

renderChips('mood-chips', Array.from(moodSet).sort(), selectedMoods);
renderChips('situation-chips', Array.from(situSet).sort(), selectedSitus);

function score(book) {
  let s = 0;
  (book.mood_tags||[]).forEach(t => { if (selectedMoods.has(t)) s += 2; });
  (book.situation_tags||[]).forEach(t => { if (selectedSitus.has(t)) s += 2; });
  return s;
}

function recommend() {
  const resultsEl = document.getElementById('results');
  let pool = BOOKS.map(b => ({ book: b, score: score(b) }));

  if (selectedMoods.size === 0 && selectedSitus.size === 0) {
    pool = pool.sort(() => Math.random() - 0.5);
  } else {
    pool = pool.filter(p => p.score > 0);
    if (pool.length === 0) {
      resultsEl.innerHTML = '<div class="empty">선택한 기분/상황에 딱 맞는 책을 못 찾았어요. 다른 태그를 골라보시거나, 초기화 후 다시 시도해보세요.</div>';
      return;
    }
    pool = pool.sort((a, b) => b.score - a.score);
  }

  const top = pool.slice(0, 3);
  resultsEl.innerHTML = top.map((p, i) => {
    const b = p.book;
    const tags = [...(b.mood_tags||[]), ...(b.situation_tags||[])];
    return `
      <div class="card">
        <div class="rank">${i+1}</div>
        <div>
          <p class="title">${b.title} <span style="color:var(--muted); font-weight:400; font-size:13px;">— ${b.author}</span></p>
          <p class="meta">${b.kdc_name||''} · ${b.publisher||''} ${b.pubYear||''}</p>
          <p class="why">${b.one_liner||''}</p>
          <div class="tag-row">${tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>
        </div>
      </div>`;
  }).join('');
}

document.getElementById('recommend-btn').addEventListener('click', recommend);
document.getElementById('reset-btn').addEventListener('click', () => {
  selectedMoods.clear(); selectedSitus.clear();
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  document.getElementById('results').innerHTML = '';
});
</script>
